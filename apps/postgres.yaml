# La base de datos de toda la plataforma. Su version (15-alpine) va fija en el
# chart porque no la construyo yo: no tiene archivo en valores/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: a601c877fa53f43d21c1f72830dce58e60e4bcce # v2.0.0
      path: P8/charts/postgres
      helm:
        releaseName: postgres
        valueFiles:
          - values-prod.yaml
    # El secreto cifrado. ArgoCD lo aplica tal cual y el controlador de
    # Sealed Secrets lo abre dentro del cluster.
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      path: secretos
      directory:
        include: postgres.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
