# La puerta de entrada desde internet. 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: plataforma
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1 # ingress-nginx 1.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          # Dos replicas y no una: en la prueba de perdida de nodo de la P9,
          # el controlador vivia solo en el nodo que se drenaba y la entrada
          # al cluster se caia unos 15 segundos, aunque los microservicios
          # siguieran vivos. Era el punto unico de fallo de la puerta.
          replicaCount: 2
          # minAvailable crea un PodDisruptionBudget: Kubernetes no puede sacar
          # la ultima replica viva durante un drenaje.
          minAvailable: 1
          # Y que no caigan las dos en el mismo nodo.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx
                        app.kubernetes.io/component: controller
          service:
            # La IP fija que reserva Terraform en la capa permanente. Sin esto,
            # cada reconstruccion traeria una IP nueva y el host del gateway
            # (<ip>.nip.io) cambiaria.
            loadBalancerIP: 136.113.9.71
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          admissionWebhooks:
            # El webhook valida los Ingress al crearlos. Lo dejo activo, pero
            # sin esperar a que el Job termine para dar la app por sana.
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # La NetworkPolicy del gateway deja entrar al trafico que viene de un
    # namespace con esta etiqueta. Si el namespace naciera sin ella, el Ingress
    # quedaria bloqueado. Va dentro de syncPolicy: al nivel de spec, ArgoCD lo
    # descarta y la app queda OutOfSync para siempre.
    managedNamespaceMetadata:
      labels:
        name: ingress-nginx
