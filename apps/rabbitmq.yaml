# La cola de mensajes. Envuelve el chart de Bitnami y su version va fija en el
# chart, igual que postgres: no tiene archivo en valores/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: a601c877fa53f43d21c1f72830dce58e60e4bcce # v2.0.0
      path: P8/charts/rabbitmq
      helm:
        releaseName: rabbitmq
        valueFiles:
          - values-prod.yaml
    # El secreto cifrado. ArgoCD lo aplica tal cual y el controlador de
    # Sealed Secrets lo abre dentro del cluster.
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      path: secretos
      directory:
        include: rabbitmq.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
