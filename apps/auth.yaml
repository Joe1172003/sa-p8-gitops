# El servicio de autenticacion.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: 3e7a2d27e6f0739d77a08b3b8c8a26f3d05ea0c9 # v2.3.0
      path: P8/charts/auth
      helm:
        releaseName: auth
        valueFiles:
          - values-prod.yaml
          - $gitops/valores/auth.yaml
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      ref: gitops
    # El secreto cifrado. ArgoCD lo aplica tal cual y el controlador de
    # Sealed Secrets lo abre dentro del cluster.
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      path: secretos
      directory:
        include: auth.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
