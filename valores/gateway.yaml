# Version de la imagen del gateway que corre en produccion. Solo cambia por PR:
# el pipeline lo abre y ArgoCD lo aplica cuando se aprueba.
imagen:
  etiqueta: "2.2.1"

# Recursos de produccion. Kyverno rechaza cualquier Pod sin limites.
recursos:
  requests:
    cpu: 15m
    memoria: 96Mi
  limits:
    cpu: 300m
    memoria: 256Mi

# Host publico del gateway. Sale de la IP fija que reserva Terraform en la capa
# permanente de la P9, asi que no cambia cuando se reconstruye el cluster.
# Este archivo se aplica despues de values-prod.yaml, por eso manda.
ingress:
  host: 136.113.9.71.nip.io
