# Las ordenes de compra.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ordenes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: f9de49bb8cc3921c74e35f03dbbb652bfc56945a # v2.2.0
      path: P8/charts/ordenes
      helm:
        releaseName: ordenes
        valueFiles:
          - values-prod.yaml
          - $gitops/valores/ordenes.yaml
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      ref: gitops
    # El secreto cifrado. ArgoCD lo aplica tal cual y el controlador de
    # Sealed Secrets lo abre dentro del cluster.
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      path: secretos
      directory:
        include: ordenes.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
