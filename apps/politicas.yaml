# Las politicas de admision de Kyverno. Son del cluster entero (ClusterPolicy),
# por eso van en el proyecto politicas y no en sa-p8. Si bloquean o solo anotan
# lo decide valores/politicas.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: politicas
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: politicas
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: d3fe0aa69bd607b952d7625092234dec0f751946 # v2.2.1
      path: P8/charts/politicas
      helm:
        releaseName: politicas
        valueFiles:
          - values-prod.yaml
          - $gitops/valores/politicas.yaml
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      ref: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
