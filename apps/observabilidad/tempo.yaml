# Tempo: el almacen de trazas. Cada peticion queda como una cascada de tramos
# (gateway, ordenes, productos, postgres) bajo un mismo trace_id.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: plataforma
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4 # Tempo 2.9.0
    helm:
      releaseName: tempo
      values: |
        tempo:
          retention: 72h
          reportingEnabled: false
          # Solo OTLP: es lo unico que habla el Collector.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          # Las trazas se juntan en memoria hasta cerrar un bloque y bajarlo a
          # disco. Por defecto el bloque dura hasta 30 min: con el trafico
          # continuo del generador (~3 peticiones/s, decenas de tramos cada
          # una) Tempo paso los 768Mi, quedo en OOMKilled y al reiniciar
          # volvia a caer recuperando el WAL. Bloques de 5 min y trazas que se
          # dan por cerradas a los 10 s sin tramos nuevos: menos en memoria.
          ingester:
            trace_idle_period: 10s
            max_block_duration: 5m
            complete_block_timeout: 15m
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1536Mi

        persistence:
          enabled: true
          size: 10Gi
          storageClassName: standard-rwo
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
