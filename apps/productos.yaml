# El catalogo de productos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: productos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8
  sources:
    - repoURL: https://github.com/Joe1172003/Practicas-SA-B-202200271.git
      targetRevision: 0d1a7240524c2f1b7f34be6702926929f7cba11a # v2.2.1 con anti-afinidad
      path: P8/charts/productos
      helm:
        releaseName: productos
        valueFiles:
          - values-prod.yaml
          - $gitops/valores/productos.yaml
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      ref: gitops
    # El secreto cifrado. ArgoCD lo aplica tal cual y el controlador de
    # Sealed Secrets lo abre dentro del cluster.
    - repoURL: https://github.com/Joe1172003/sa-p8-gitops.git
      targetRevision: main
      path: secretos
      directory:
        include: productos.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
